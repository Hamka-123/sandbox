apiVersion: v1
kind: Pod
metadata:
  name: go
  labels:
    app: go
spec:
  containers:
  - name: go
    image: hcr.io/hamka-123/go-web-app:latest
    ports:
    - containerPort: 8080
    # --- Блок добавления переменных окружения ---
    env:
    - name: APP_ENV
      value: "production"
    - name: DB_HOST
      value: "db.example.com"
    - name: LOG_LEVEL
      value: "debug"
    # --------------------------------------------
    resources:
      requests:
        memory: "6Mi"
        cpu: "250m"
      limits:
        memory: "32Mi"
        cpu: "500m"
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 1
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 1
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
data:
  settings.json: |
    {
      "environment": "development",
      "debug": true
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-pod
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "cat /etc/config/settings.json && sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: my-app-config

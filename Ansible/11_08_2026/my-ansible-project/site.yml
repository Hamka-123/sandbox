- name: Deploy Dynamic Web Server
  hosts: webservers
  become: true

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present

    # THIS IS THE UPDATED TASK (Using template instead of copy)
    - name: Deploy dynamic Nginx configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer="defer"></script>
</head>
<body>
    <!-- h1{JS Timer}+div#msg{MESSAGE}+ul>li*4{Window Method $}^button[onclick="displayMsg()"]{Display message in 5 sec} -->
<h1>JS Timer</h1>
<div id="msg">MESSAGE</div>
<div id="counter"></div>
<ul>
    <li>Window Method 1</li>
    <li>Window Method 2</li>
    <li>Window Method 3</li>
    <li>Window Method 4</li>
</ul>
<button onclick="displayMsg()">Display message in 2 sec</button>
<button onclick="cancelMsg()">Clear timeout</button>
<button onclick="startCounter()">Start counter</button>
<button onclick="stopCounter()">Stop counter</button>

<h1>Slider</h1>
<div id="slider">
    <img src="image1.webp" alt="">
</div>
<button onclick="startSlider()">Start</button>
<button onclick="stopSlider()">Stop</button>



<aside id="chat">Hello! Can I help You?</aside>
</body>
</html>

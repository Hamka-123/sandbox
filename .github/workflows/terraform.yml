name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select action (apply / destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      environment:
        description: "Environment / Workspace"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

      image_tag:
        description: "Image tag to deploy (e.g. sha-34ac481 or latest). Leave empty to auto-detect."
        required: false
        default: ""
        type: string

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  # changed to OIDC
  # ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  # ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Автоматически передаем логин и токен для провайдера docker в Terraform
  TF_VAR_ghcr_username: ${{ github.actor }}
  TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
  # Передаем образ по умолчанию
  # TF_VAR_container_image: "ghcr.io/hamka-123/go-web-app:latest"

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./go-web-site/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Save GitHub OIDC token to file
        shell: bash
        run: |
          response="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange"
          )"

          jq -r '.value' <<< "$response" > github-oidc-token.jwt
      - name: Upload an Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: github-oidc-token.jwt
          # A file, directory or wildcard pattern that describes what to upload.
          path: ./go-web-site/infra/github-oidc-token.jwt

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure Accout info
        run: az account show

      - name: Save Azure access token to file
        shell: bash
        run: |
          az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken \
            --output tsv > azure-access-token.jwt

      - name: Upload an Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: azure-access-token.jwt
          # A file, directory or wildcard pattern that describes what to upload.
          path: ./go-web-site/infra/azure-access-token.jwt

      - name: Terraform Init
        run: terraform init

      - name: Select or Create Workspace
        run: |
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Get Last Successful Build SHA
        id: get-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Проверяем, передан ли тег вручную при запуске
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "TAG=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Если поле пустое — запрашиваем SHA последнего успешного билда
          LAST_SHA=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow="go-webapp-build.yml" \
            --status=success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha')

          if [ -z "$LAST_SHA" ]; then
            echo "Error: No successful build found in go-webapp-build.yml!"
            exit 1
          fi

          SHORT_SHA=$(echo $LAST_SHA | cut -c1-7)
          echo "TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT
      - name: Terraform Plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            echo "Deploying image tag: ${{ steps.get-sha.outputs.TAG }}"
            terraform plan -out=tfplan -var="image_tag=${{ steps.get-sha.outputs.TAG }}"
          fi

      - name: Terraform ${{ inputs.action }}
        run: |
          terraform apply -auto-approve tfplan

name: Test Get Last Build SHA

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  check-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Get Last Successful Build SHA
        env:
          GH_TOKEN: ${{ github.token }} # Обязательно: даем права утилите gh
        run: |
          LAST_SHA=$(gh run list \
            --workflow="go-webapp-build.yml" \
            --status=success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha')

          if [ -z "$LAST_SHA" ]; then
            echo "❌ Ошибка: Успешных запусков для go-webapp-build.yml не найдено!"
            exit 1
          fi

          SHORT_SHA=$(echo $LAST_SHA | cut -c1-7)

          echo "----------------------------------------"
          echo "Полный SHA:  $LAST_SHA"
          echo "Короткий SHA (Тег): $SHORT_SHA"
          echo "----------------------------------------"
